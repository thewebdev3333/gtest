<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G Wave Admin</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e6e6e6;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Container ── */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c853, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-header .subtitle {
            font-size: 14px;
            color: #888;
        }
        .admin-header .actions {
            display: flex;
            gap: 10px;
        }

        /* ── Buttons ── */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #00c853;
            color: #0d0d0d;
        }
        .btn-primary:hover {
            background: #00e676;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
        }
        .btn-outline:hover {
            border-color: #555;
            color: #fff;
        }
        .btn-success {
            background: #00c853;
            color: #0d0d0d;
        }
        .btn-success:hover {
            background: #00e676;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Stats Grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 16px 20px;
        }
        .stat-card .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-card .value.green {
            color: #00c853;
        }
        .stat-card .value.yellow {
            color: #f59e0b;
        }
        .stat-card .value.red {
            color: #ef4444;
        }
        .stat-card .value.white {
            color: #e6e6e6;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover {
            color: #ccc;
        }
        .tab.active {
            color: #00c853;
            border-bottom-color: #00c853;
        }
        .tab .badge {
            background: #2a2a2a;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 6px;
            color: #aaa;
        }
        .tab .badge.warning {
            background: #f59e0b20;
            color: #f59e0b;
        }

        /* ── Panel ── */
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }

        /* ── Cards / Lists ── */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card-item {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-item .info {
            flex: 1;
            min-width: 200px;
        }
        .card-item .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .card-item .info .email {
            font-size: 13px;
            color: #888;
        }
        .card-item .info .meta {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .card-item .info .badge-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
        }
        .badge-status.pending {
            background: #f59e0b20;
            color: #f59e0b;
        }
        .badge-status.approved {
            background: #00c85320;
            color: #00c853;
        }
        .badge-status.rejected {
            background: #ef444420;
            color: #ef4444;
        }
        .badge-status.completed {
            background: #00c85320;
            color: #00c853;
        }
        .badge-status.failed {
            background: #ef444420;
            color: #ef4444;
        }

        .card-item .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ── Table ── */
        .table-wrap {
            overflow-x: auto;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: #888;
            font-weight: 500;
            border-bottom: 1px solid #2a2a2a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1a1a1a;
        }
        tr:hover td {
            background: #151515;
        }

        /* ── Empty State ── */
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: #666;
        }
        .empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }
        .empty p {
            font-size: 15px;
        }

        /* ── Loader ── */
        .loader {
            display: flex;
            justify-content: center;
            padding: 48px 0;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #2a2a2a;
            border-top-color: #00c853;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }
        .toast.success {
            background: #00c853;
            color: #0d0d0d;
        }
        .toast.error {
            background: #ef4444;
            color: #fff;
        }
        .toast.info {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e6e6e6;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                align-items: stretch;
            }
            .admin-header .actions {
                flex-wrap: wrap;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .card-item {
                flex-direction: column;
            }
            .card-item .actions {
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 0;
            }
            .tab {
                padding: 8px 14px;
                font-size: 13px;
                white-space: nowrap;
            }
        }

    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div>
                <h1>⚡ G Wave Admin</h1>
                <div class="subtitle">Platform management dashboard</div>
            </div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" onclick="refreshAll()">↻ Refresh</button>
                <button class="btn btn-outline btn-sm" onclick="refreshRate()">⟳ Refresh Rate</button>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">🚪 Logout</button>
                <button class="btn btn-outline btn-sm" onclick="window.location.href='/'">← Back to App</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="label">Total Users</div><div class="value white" id="statUsers">—</div></div>
            <div class="stat-card"><div class="label">Total Deposits</div><div class="value green" id="statDeposits">—</div></div>
            <div class="stat-card"><div class="label">Real Balance</div><div class="value green" id="statBalance">—</div></div>
            <div class="stat-card">
                <div class="label">Total Balance (incl. Pending W/D)</div>
                <div class="value white" id="statGrossBalance">—</div>
            </div>
            <div class="stat-card"><div class="label">Pending Withdrawals</div><div class="value yellow" id="statPending">—</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="dashboard">Dashboard</button>
            <button class="tab" data-tab="kyc">KYC <span class="badge warning" id="kycBadge">0</span></button>
            <button class="tab" data-tab="transactions">Transactions <span class="badge warning" id="wdBadge">0</span></button>
            <button class="tab" data-tab="users">Users</button>
            <button class="tab" data-tab="exchange">Exchange Rate</button>
        </div>

        <!-- ── PANEL: Dashboard ── -->
        <div class="panel active" id="panel-dashboard">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">
                <div class="stat-card"><div class="label">Demo Balance</div><div class="value white" id="statDemo">—</div></div>
                <div class="stat-card"><div class="label">Total Withdrawn</div><div class="value white" id="statWithdrawn">—</div></div>
                <div class="stat-card"><div class="label">Influencer Withdrawn</div><div class="value white" id="statInfluencer">—</div></div>
                <div class="stat-card"><div class="label">Exchange Rate</div><div class="value green" id="statRate">— KES/USD</div></div>
            </div>
            <div style="margin-top:16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:16px;">
                <div style="font-weight:500;margin-bottom:12px;">Recent Users</div>
                <div id="recentUsers"><div class="loader"><div class="spinner"></div></div></div>
            </div>
        </div>

        <!-- ── PANEL: KYC ── -->
        <div class="panel" id="panel-kyc">
            <div id="kycList"><div class="loader"><div class="spinner"></div></div></div>
        </div>

        <!-- ── PANEL: Transactions ── -->
        <div class="panel" id="panel-transactions">
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:12px 16px;">
                <label style="font-size:13px;color:#888;">Type
                    <select id="txTypeFilter" onchange="loadTransactions(1)" style="margin-left:8px;background:#0d0d0d;border:1px solid #2a2a2a;color:#e6e6e6;border-radius:6px;padding:6px 10px;font-size:13px;">
                        <option value="">All</option>
                        <option value="deposit">Deposits</option>
                        <option value="withdrawal">Withdrawals</option>
                        <option value="trade_win">Wins</option>
                        <option value="trade_loss">Losses</option>
                        <option value="stake">Stakes</option>
                    </select>
                </label>
                <label style="font-size:13px;color:#888;">Status
                    <select id="txStatusFilter" onchange="loadTransactions(1)" style="margin-left:8px;background:#0d0d0d;border:1px solid #2a2a2a;color:#e6e6e6;border-radius:6px;padding:6px 10px;font-size:13px;">
                        <option value="">All</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                    </select>
                </label>
                <button class="btn btn-outline btn-sm" onclick="loadTransactions(1)">Apply</button>
                <div id="txPageInfo" style="margin-left:auto;font-size:13px;color:#666;"></div>
            </div>
            <div id="txList"><div class="loader"><div class="spinner"></div></div></div>
            <div style="display:flex;justify-content:center;gap:10px;margin-top:16px;">
                <button class="btn btn-outline btn-sm" onclick="txPage > 1 && loadTransactions(txPage - 1)">← Prev</button>
                <button class="btn btn-outline btn-sm" onclick="loadTransactions(txPage + 1)">Next →</button>
            </div>
        </div>

        <!-- ── PANEL: Users ── -->
        <div class="panel" id="panel-users">
            <div id="usersTable"><div class="loader"><div class="spinner"></div></div></div>
        </div>

        <!-- ── PANEL: Exchange Rate ── -->
        <div class="panel" id="panel-exchange">
            <div id="exchangeContent"><div class="loader"><div class="spinner"></div></div></div>
        </div>

    </div>

    <!-- ── Toast Container ── -->
    <div class="toast-container" id="toasts"></div>

    <script>
        // ── Config ──
        const API_URL = window.location.origin;
        const FRONTEND_URL = 'http://localhost:3000';

        // ── Toast ──
        function toast(message, type = 'info') {
            const container = document.getElementById('toasts');
            if (!container) {
                console.warn('[Toast] container missing:', message, type);
                return;
            }
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // ── Token Management ──
        function getToken() {
            return sessionStorage.getItem('gwave_admin_token') || '';
        }

        function setToken(token) {
            sessionStorage.setItem('gwave_admin_token', token);
        }

        function removeToken() {
            sessionStorage.removeItem('gwave_admin_token');
            sessionStorage.removeItem('gwave_admin_user');
        }

        let token = getToken();

        // ── Fetch Helper ──
        async function apiFetch(endpoint, options = {}) {
            const currentToken = getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (currentToken) {
                headers['Authorization'] = `Bearer ${currentToken}`;
            } else {
            }
            
            const res = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
            
            const data = await res.json();
            if (!res.ok) {
                if (res.status === 401) {
                    toast('Session expired. Please log in again.', 'error');
                    removeToken();
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 500);
                }
                throw new Error(data.error || data.message || 'Request failed');
            }
            return data;
        }

        // ── Auth Check ──
        async function checkAuth() {
            const currentToken = getToken();
            
            if (!currentToken) {
                window.location.href = '/admin/login.html';
                return false;
            }
            
            try {
                // Try to fetch stats to verify token
                const data = await apiFetch('/admin/stats');
                if (!data.success) {
                    throw new Error('Not authenticated');
                }
                return true;
            } catch (e) {
                console.warn('[Auth] check failed:', e.message);
                removeToken();
                window.location.href = '/admin/login.html';
                return false;
            }
        }

        // ── Logout ──
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                removeToken();
                toast('Logged out successfully', 'success');
                setTimeout(() => {
                    window.location.href = '/admin/login.html';
                }, 500);
            }
        }

        // ── Gross Balance (Real Balance + Pending Withdrawals) ──
        // Pending withdrawal amounts are still sitting in our account until
        // they're approved/paid out, so this card adds them back on top of
        // the "Real Balance" stat rather than treating them as already gone.
        const statCache = { totalBalanceReal: 0, totalPendingWithdrawals: 0 };

        function updateGrossBalanceCard() {
            const gross = statCache.totalBalanceReal + statCache.totalPendingWithdrawals;
            document.getElementById('statGrossBalance').textContent =
                '$' + gross.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ── Load Data ──
        async function loadAll() {
            try {
                await Promise.all([
                    loadStats(),
                    loadKYC(),
                    loadTransactions(txPage),
                    loadUsers(),
                    loadExchange(),
                ]);
            } catch (e) {
                console.error('[Admin] Load error:', e);
            }
        }

        async function loadStats() {
            try {
                const data = await apiFetch('/admin/stats');
                if (data.success) {
                    const s = data.data;
                    document.getElementById('statUsers').textContent = s.totalUsers || 0;
                    document.getElementById('statDeposits').textContent = '$' + (s.totalDeposited || 0).toLocaleString();
                    document.getElementById('statBalance').textContent = '$' + (s.totalBalanceReal || 0).toLocaleString();
                    statCache.totalBalanceReal = s.totalBalanceReal || 0;
                    updateGrossBalanceCard();
                    document.getElementById('statDemo').textContent = '$' + (s.totalBalanceDemo || 0).toLocaleString();
                    document.getElementById('statWithdrawn').textContent = '$' + (s.totalWithdrawn || 0).toLocaleString();
                    document.getElementById('statInfluencer').textContent = '$' + (s.totalInfluencerWithdrawn || 0)
                        .toLocaleString();
                }
            } catch (e) {
                console.error('[Stats] Error:', e);
            }
        }

        async function loadKYC() {
            try {
                const data = await apiFetch('/admin/kyc/pending');
                const container = document.getElementById('kycList');
                const badge = document.getElementById('kycBadge');

                if (!data.success || !data.data.submissions || data.data.submissions.length === 0) {
                    badge.textContent = '0';
                    container.innerHTML =
                        `<div class="empty"><div class="icon">✅</div><p>No pending KYC submissions</p></div>`;
                    return;
                }

                const list = data.data.submissions;
                badge.textContent = list.length;
                // NOTE: don't write to #statPending here — that element is
                // the "Pending Withdrawals" stat card and is owned by
                // loadTransactions()'s withdrawal-pending fetch below. KYC
                // submissions default to 'pending' for every signup until
                // they submit documents (see trigger.sql), so this count is
                // "unverified users", not "pending withdrawals" — writing
                // it here was clobbering the real withdrawal count whenever
                // KYC loaded after transactions.

                let html = '<div class="card-list">';
                for (const item of list) {
                    const name = item.display_name || item.email || 'Unknown';
                    const email = item.email || '';
                    html += `
                        <div class="card-item">
                            <div class="info">
                                <div class="name">${escapeHtml(name)}</div>
                                <div class="email">${escapeHtml(email)}</div>
                                <div class="meta">Submitted: ${new Date(item.submitted_at).toLocaleString()}</div>
                                <span class="badge-status pending">Pending</span>
                            </div>
                            <div class="actions">
                                <button class="btn btn-success btn-sm" onclick="reviewKYC('${item.user_id}','approved')">✓ Approve</button>
                                <button class="btn btn-danger btn-sm" onclick="reviewKYC('${item.user_id}','rejected')">✕ Reject</button>
                            </div>
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            } catch (e) {
                console.error('[KYC] Error:', e);
                document.getElementById('kycList').innerHTML =
                    `<div class="empty"><div class="icon">⚠️</div><p>Failed to load KYC submissions</p></div>`;
            }
        }

        // ── Transactions (replaces the old Withdrawals-only tab) ──
        let txPage = 1;
        const TX_TYPE_LABELS = {
            deposit: 'Deposit',
            withdrawal: 'Withdrawal',
            trade_win: 'Win',
            trade_loss: 'Loss',
            stake: 'Stake',
        };

        async function loadTransactions(page = 1) {
            txPage = page;
            try {
                const type = document.getElementById('txTypeFilter').value;
                const status = document.getElementById('txStatusFilter').value;
                const params = new URLSearchParams({ page, limit: 20 });
                if (type) params.set('type', type);
                if (status) params.set('status', status);

                const data = await apiFetch(`/admin/transactions?${params.toString()}`);
                const container = document.getElementById('txList');

                // Pending-withdrawal count still drives the tab badge and the
                // dashboard's "Pending Withdrawals" stat, independent of
                // whatever filter is currently applied to the table.
                try {
                    const pending = await apiFetch('/admin/withdrawals/pending');
                    const pendingWithdrawals = pending?.data?.withdrawals || [];
                    const count = pendingWithdrawals.length;
                    document.getElementById('wdBadge').textContent = count;
                    document.getElementById('statPending').textContent = count;

                    statCache.totalPendingWithdrawals = pendingWithdrawals.reduce(
                        (sum, w) => sum + (parseFloat(w.amount_usd) || 0), 0
                    );
                    updateGrossBalanceCard();
                } catch (e) { /* non-fatal */ }

                if (!data.success || !data.data.transactions || data.data.transactions.length === 0) {
                    container.innerHTML =
                        `<div class="empty"><div class="icon">💳</div><p>No transactions found</p></div>`;
                    document.getElementById('txPageInfo').textContent = '';
                    return;
                }

                const list = data.data.transactions;
                document.getElementById('txPageInfo').textContent =
                    `Page ${data.data.page} of ${data.data.totalPages} · ${data.data.total} total`;

                let html = '<div class="card-list">';
                for (const item of list) {
                    const name = item.display_name || item.email || 'Unknown';
                    const email = item.email || '';
                    const typeLabel = TX_TYPE_LABELS[item.type] || item.type;
                    const amount = `$${parseFloat(item.amount_usd).toFixed(2)}${item.amount_kes ? ' · KES ' + parseFloat(item.amount_kes).toFixed(2) : ''}`;
                    const statusClass = item.status === 'completed' ? 'approved' : item.status === 'failed' ? 'rejected' : 'pending';

                    const canReview = item.type === 'withdrawal' && item.withdrawal_request_status === 'pending_review';

                    html += `
                        <div class="card-item">
                            <div class="info">
                                <div class="name">${escapeHtml(name)} <span style="color:#666;font-weight:400;">· ${typeLabel}</span></div>
                                <div class="email">${escapeHtml(email)}</div>
                                <div class="meta">${amount}${item.method ? ' · ' + escapeHtml(item.method) : ''}</div>
                                <div class="meta">${new Date(item.created_at).toLocaleString()}</div>
                                <span class="badge-status ${statusClass}">${escapeHtml(item.status)}</span>
                            </div>
                            ${canReview ? `
                            <div class="actions">
                                <button class="btn btn-success btn-sm" onclick="reviewWithdrawal('${item.withdrawal_request_id}','approve')">✓ Approve</button>
                                <button class="btn btn-danger btn-sm" onclick="reviewWithdrawal('${item.withdrawal_request_id}','reject')">✕ Reject</button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            } catch (e) {
                console.error('[Transactions] Error:', e);
                document.getElementById('txList').innerHTML =
                    `<div class="empty"><div class="icon">⚠️</div><p>Failed to load transactions</p></div>`;
            }
        }

        async function loadUsers() {
            try {
                const data = await apiFetch('/admin/users?limit=50');
                const container = document.getElementById('usersTable');

                if (!data.success || !data.data.users || data.data.users.length === 0) {
                    container.innerHTML = `<div class="empty"><div class="icon">👤</div><p>No users found</p></div>`;
                    return;
                }

                const users = data.data.users;

                // Recent users for dashboard
                let recentHtml = '';
                for (const u of users.slice(0, 5)) {
                    const name = u.display_name || u.email || 'Unknown';
                    const role = u.role || 'user';
                    const kyc = u.kyc_status || 'none';
                    recentHtml += `
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:14px;">
                            <span>${escapeHtml(name)}</span>
                            <span style="color:#888;font-size:13px;">${escapeHtml(u.email || '')}</span>
                            <span>
                                <span style="background:#2a2a2a;padding:2px 8px;border-radius:4px;font-size:11px;">${role}</span>
                                <span style="background:${kyc === 'approved' ? '#00c85320' : '#2a2a2a'};padding:2px 8px;border-radius:4px;font-size:11px;color:${kyc === 'approved' ? '#00c853' : '#888'};">${kyc}</span>
                            </span>
                        </div>
                    `;
                }
                document.getElementById('recentUsers').innerHTML = recentHtml || '<div style="color:#666;">No users</div>';

                // Full users table
                const ROLE_OPTIONS = ['user', 'support', 'tech', 'influencer', 'admin'];
                let tableHtml = `
                    <table>
                        <thead><tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>KYC</th>
                            <th>Joined</th>
                        </tr></thead>
                        <tbody>
                `;
                for (const u of users) {
                    const name = u.display_name || u.email || 'Unknown';
                    const role = u.role || 'user';
                    const kyc = u.kyc_status || 'none';
                    const roleOptionsHtml = ROLE_OPTIONS.map(r =>
                        `<option value="${r}" ${r === role ? 'selected' : ''}>${r}</option>`
                    ).join('');
                    tableHtml += `
                        <tr>
                            <td><strong>${escapeHtml(name)}</strong></td>
                            <td style="color:#888;">${escapeHtml(u.email || '')}</td>
                            <td>
                                <select
                                    data-current="${role}"
                                    onchange="updateUserRole('${u.id}', this.value, this)"
                                    style="background:#0d0d0d;border:1px solid #2a2a2a;color:#e6e6e6;border-radius:4px;padding:4px 8px;font-size:12px;">
                                    ${roleOptionsHtml}
                                </select>
                            </td>
                            <td><span style="background:${kyc === 'approved' ? '#00c85320' : '#2a2a2a'};padding:2px 8px;border-radius:4px;font-size:12px;color:${kyc === 'approved' ? '#00c853' : '#888'};">${kyc}</span></td>
                            <td style="color:#666;font-size:12px;">${new Date(u.created_at).toLocaleDateString()}</td>
                        </tr>
                    `;
                }
                tableHtml += '</tbody></table>';
                container.innerHTML = `<div class="table-wrap">${tableHtml}</div>`;
            } catch (e) {
                console.error('[Users] Error:', e);
                document.getElementById('usersTable').innerHTML =
                    `<div class="empty"><div class="icon">⚠️</div><p>Failed to load users</p></div>`;
            }
        }

        let currentExchangeRate = 0;

        function convertFromUsd() {
            const usd = parseFloat(document.getElementById('convUsd').value);
            const kesField = document.getElementById('convKes');
            if (isNaN(usd) || !currentExchangeRate) {
                kesField.value = '';
                return;
            }
            kesField.value = (usd * currentExchangeRate).toFixed(2);
        }

        function convertFromKes() {
            const kes = parseFloat(document.getElementById('convKes').value);
            const usdField = document.getElementById('convUsd');
            if (isNaN(kes) || !currentExchangeRate) {
                usdField.value = '';
                return;
            }
            usdField.value = (kes / currentExchangeRate).toFixed(2);
        }

        async function loadExchange() {
            try {
                const data = await apiFetch('/admin/exchange/rate');
                const container = document.getElementById('exchangeContent');

                if (data.success) {
                    const current = data.data.current;
                    const history = data.data.history || [];
                    currentExchangeRate = parseFloat(current.rate) || 0;

                    document.getElementById('statRate').textContent = current.rate + ' KES/USD';

                    let html = `
                        <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:20px;">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                                <div>
                                    <div style="font-size:14px;color:#888;">Current Exchange Rate</div>
                                    <div style="font-size:36px;font-weight:700;color:#00c853;">${current.rate} KES/USD</div>
                                    <div style="font-size:12px;color:#666;margin-top:4px;">
                                        Updated: ${current.updated_at ? new Date(current.updated_at).toLocaleString() : 'Never'} · Source: ${current.source || 'unknown'}
                                    </div>
                                </div>
                                <button class="btn btn-primary" onclick="refreshRate()">⟳ Refresh Now</button>
                            </div>
                            <div style="margin-top:20px;padding-top:20px;border-top:1px solid #2a2a2a;">
                                <div style="font-size:13px;color:#888;margin-bottom:10px;">Currency Converter</div>
                                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
                                    <div>
                                        <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">USD</label>
                                        <input type="number" id="convUsd" placeholder="0.00" oninput="convertFromUsd()"
                                            style="background:#0d0d0d;border:1px solid #2a2a2a;color:#e6e6e6;border-radius:6px;padding:8px 12px;font-size:14px;width:160px;">
                                    </div>
                                    <div style="font-size:18px;color:#666;padding-bottom:8px;">⇄</div>
                                    <div>
                                        <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">KES</label>
                                        <input type="number" id="convKes" placeholder="0.00" oninput="convertFromKes()"
                                            style="background:#0d0d0d;border:1px solid #2a2a2a;color:#e6e6e6;border-radius:6px;padding:8px 12px;font-size:14px;width:160px;">
                                    </div>
                                </div>
                            </div>
                            ${history.length > 0 ? `
                            <div style="margin-top:20px;">
                                <div style="font-size:13px;color:#888;margin-bottom:8px;">Recent History</div>
                                <div style="display:flex;flex-wrap:wrap;gap:8px;">
                                    ${history.slice(0, 10).map(h => `
                                        <span style="background:#2a2a2a;padding:4px 12px;border-radius:4px;font-size:13px;">
                                            ${h.rate} <span style="color:#666;font-size:11px;">${new Date(h.updated_at).toLocaleTimeString()}</span>
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                    container.innerHTML = html;
                }
            } catch (e) {
                console.error('[Exchange] Error:', e);
                document.getElementById('exchangeContent').innerHTML =
                    `<div class="empty"><div class="icon">⚠️</div><p>Failed to load exchange rate</p></div>`;
            }
        }

        // ── Actions ──
        async function updateUserRole(userId, role, selectEl) {
            const previous = selectEl.dataset.current;
            if (role === previous) return;

            let currentAdminId = null;
            try {
                currentAdminId = JSON.parse(sessionStorage.getItem('gwave_admin_user') || '{}').id;
            } catch (e) { /* ignore */ }

            let confirmMsg = `Change this user's role to "${role}"?`;
            if (userId === currentAdminId && role !== 'admin') {
                confirmMsg = `⚠️ You're changing your OWN role to "${role}". You will likely lose admin access immediately. Continue?`;
            }
            if (!confirm(confirmMsg)) {
                selectEl.value = previous;
                return;
            }

            selectEl.disabled = true;
            try {
                await apiFetch(`/admin/users/${userId}/role`, {
                    method: 'POST',
                    body: JSON.stringify({ role })
                });
                selectEl.dataset.current = role;
                toast(`Role updated to ${role}`, 'success');
            } catch (e) {
                selectEl.value = previous;
                toast(e.message || 'Failed to update role', 'error');
            } finally {
                selectEl.disabled = false;
            }
        }

        async function reviewKYC(userId, status) {
            if (!confirm(`Review KYC as ${status.toUpperCase()}?`)) return;
            try {
                const data = await apiFetch('/admin/kyc/review', {
                    method: 'POST',
                    body: JSON.stringify({ userId, status })
                });
                toast(`KYC ${status} successfully`, 'success');
                loadKYC();
                loadStats();
            } catch (e) {
                toast(e.message || 'Failed to review KYC', 'error');
            }
        }

        async function reviewWithdrawal(withdrawalId, action) {
            if (!confirm(`Review withdrawal as ${action.toUpperCase()}?`)) return;
            try {
                const data = await apiFetch('/admin/withdrawals/review', {
                    method: 'POST',
                    body: JSON.stringify({ withdrawalId, action })
                });
                toast(`Withdrawal ${action}d successfully`, 'success');
                loadTransactions(txPage);
                loadStats();
            } catch (e) {
                toast(e.message || 'Failed to review withdrawal', 'error');
            }
        }

        async function refreshRate() {
            try {
                const data = await apiFetch('/admin/exchange/refresh', { method: 'POST' });
                toast(`Rate refreshed: ${data.data.rate} KES/USD`, 'success');
                loadExchange();
            } catch (e) {
                toast(e.message || 'Failed to refresh rate', 'error');
            }
        }

        async function refreshAll() {
            toast('Refreshing...', 'info');
            await loadAll();
            toast('All data refreshed', 'success');
        }

        // ── Tab Switching ──
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                const panel = document.getElementById('panel-' + this.dataset.tab);
                if (panel) panel.classList.add('active');
            });
        });

        // ── Helpers ──
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Init ──
        async function init() {
            
            // Check for token in URL (after login redirect)
            const params = new URLSearchParams(window.location.search);
            const urlToken = params.get('token');
            if (urlToken) {
                setToken(urlToken);
                token = urlToken;
                window.history.replaceState({}, document.title, window.location.pathname);
                toast('Logged in successfully', 'success');
            }

            // Get token from storage
            token = getToken();

            // If no token, redirect to login
            if (!token) {
                window.location.href = '/admin/login.html';
                return;
            }

            try {
                const authenticated = await checkAuth();
                if (authenticated) {
                    await loadAll();
                    // Auto-refresh every 30 seconds
                    setInterval(loadAll, 30000);
                } else {
                    window.location.href = '/admin/login.html';
                }
            } catch (e) {
                console.error('[Admin] Init error:', e);
                toast('Failed to load admin data', 'error');
            }
        }

        // Run init when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
